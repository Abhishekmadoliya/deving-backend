services:
  redis:
    image: redis
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo
    container_name: mongo-server
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data

volumes:
  redis_data:
  mongo_data:
