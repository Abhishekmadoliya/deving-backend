services:
  api:
    build: .
    container_name: devign-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    env_file:
      - .env.production
    volumes:
      - ./marine-guard-438713-q1-4a078155e02a.json:/usr/src/app/service-account.json:ro

  worker:
    build: .
    container_name: devign-worker
    restart: always
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    env_file:
      - .env.production
    volumes:
      - ./marine-guard-438713-q1-4a078155e02a.json:/usr/src/app/service-account.json:ro

  build-worker:
    build: .
    container_name: devign-build-worker
    restart: always
    command: ["npm", "run", "start:build-worker"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    env_file:
      - .env.production
    volumes:
      - ./marine-guard-438713-q1-4a078155e02a.json:/usr/src/app/service-account.json:ro

  redis:
    image: redis:alpine
    container_name: devign-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
