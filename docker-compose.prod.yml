services:
  api:
    build: .
    container_name: devign-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/devign
      # Add other necessary env vars from your .env file here
    depends_on:
      - redis
      - mongo
    env_file:
      - .env

  worker:
    build: .
    container_name: devign-worker
    restart: always
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/devign
    depends_on:
      - redis
      - mongo
    env_file:
      - .env

  build-worker:
    build: .
    container_name: devign-build-worker
    restart: always
    command: ["npm", "run", "start:build-worker"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/devign
    depends_on:
      - redis
      - mongo
    env_file:
      - .env

  redis:
    image: redis:alpine
    container_name: devign-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:latest
    container_name: devign-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data

volumes:
  redis_data:
  mongo_data:
